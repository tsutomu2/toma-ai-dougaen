<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI動画ウィークリー</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <h1>AI動画ウィークリー</h1>
        <p class="lead">AI の新機能・使い方を紹介する日本語の YouTube 動画（直近7日間。Seedance は30日間）</p>
      </div>
      <dl class="kpis" id="kpis"></dl>
    </div>
  </header>

  <div class="toolbar">
    <nav class="wrap tabs" id="tabs" role="tablist" aria-label="テーマ"></nav>
    <div class="wrap toolbar-inner">
      <div class="seg" role="group" aria-label="並び順" data-key="sort">
        <button type="button" data-value="views" aria-pressed="true">再生数順</button>
        <button type="button" data-value="date" aria-pressed="false">新しい順</button>
      </div>
      <label class="check"><input type="checkbox" id="hideShorts" checked> ショートを隠す</label>
      <label class="check"><input type="checkbox" id="onlySummarized"> 要約済みのみ</label>
      <input type="search" id="query" class="search" placeholder="タイトル・チャンネルで絞り込み" aria-label="絞り込み">
      <button type="button" id="refresh" class="refresh">最新を取得</button>
    </div>
  </div>

  <main class="wrap">
    <div id="status" class="status" role="status"></div>
    <section id="guide" class="guide" hidden></section>
    <div id="list" class="grid"></div>
  </main>

  <footer class="wrap footer">
    要約は動画のタイトル・説明文をもとに Claude が作成したものです。再生数は取得時点の値です。
  </footer>

  <script>
    // config.js（API キー）は任意。無い場合は保存済みデータだけを表示する。
    window.YT_API_KEY = window.YT_API_KEY || '';
  </script>
  <script src="config.js" onerror="void 0"></script>
  <script src="data/videos.js" onerror="void 0"></script>
  <script src="data/summaries.js" onerror="void 0"></script>
  <script src="data/guides.js" onerror="void 0"></script>
  <script src="js/youtube.js"></script>
  <script src="app.js"></script>
</body>
</html>
